<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Иконка «Аудит amoCRM»: кольцо-оценка + галочка, фирменные цвета SolutionCRM.
       Фон на весь квадрат (без прозрачных углов), всё важное — в центральных 60%,
       чтобы иконку можно было обрезать в круг или скруглённый квадрат на Android. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e8bb4"/>
      <stop offset="1" stop-color="#2c5a80"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- фоновое кольцо -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="34"/>
  <!-- заполненная часть кольца (~75%), как оценка в процентах -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#7fd08e" stroke-width="34" stroke-linecap="round"
          stroke-dasharray="556 742" transform="rotate(-90 256 256)"/>
  <!-- галочка -->
  <path d="M203 258 L240 295 L312 220" fill="none" stroke="#ffffff" stroke-width="34"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
