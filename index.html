<html lang="ru">
<head>

  <title>Аудит amoCRM — SolutionCRM</title>
  <meta name="description" content="Проверьте настройку amoCRM по чек-листу за 10–15 минут и получите список, что исправить.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2c5a80">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Аудит amoCRM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-action="home" aria-label="На старт">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>SolutionCRM</span>
    </a>
    <span class="topbar-title">Аудит amoCRM</span>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="backup">
      <p class="backup-note">Ответы хранятся только в этом браузере. Сохраните копию, чтобы не потерять их при очистке браузера.</p>
      <div class="backup-actions">
        <button type="button" class="btn btn-ghost btn-sm" data-action="export">Скачать копию данных</button>
        <label class="btn btn-ghost btn-sm file-btn">
          Загрузить копию
          <input type="file" accept="application/json,.json" id="importFile">
        </label>
      </div>
    </div>
    <p class="footer-sign">Чек-лист подготовила команда SolutionCRM — внедрение и сопровождение amoCRM.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
